name: CI Wayland minimal capture
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container: archlinux:base-devel
    steps:
      - name: Install the CI runtime only
        run: pacman -Syu --noconfirm --needed git quickshell kwin python-pillow mesa libcap dbus qt6-wayland
      - uses: actions/checkout@v7
      - name: Apply the already confirmed container capability fix
        run: |
          binary=$(command -v kwin_wayland)
          if [ -n "$(getcap "$binary")" ]; then setcap -r "$binary"; fi
      - name: Capture one minimal Wayland session
        run: sh tests/ci-wayland-probe/capture.sh
      - name: Upload logs from this attempt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-wayland-minimal-logs
          path: tests/ci-wayland-probe/logs.*/
          if-no-files-found: warn
